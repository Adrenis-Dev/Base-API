<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Base APIs - Dylan Modz</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      min-height: 100vh;
      background: #050505;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 22px;
    }

    .box {
      width: 100%;
      max-width: 560px;
      text-align: center;
      padding: 38px 28px;
      border-radius: 28px;
      background: #0b0b0b;
      border: 1px solid #242424;
      box-shadow: 0 30px 90px rgba(0, 0, 0, .55);
    }

    .icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 20px;
      border-radius: 20px;
      background: #fff;
      color: #000;
      display: grid;
      place-items: center;
      font-size: 30px;
      box-shadow: 0 18px 45px rgba(255, 255, 255, .08);
    }

    h1 {
      font-size: clamp(34px, 8vw, 54px);
      line-height: .95;
      letter-spacing: -2.5px;
      margin-bottom: 16px;
      font-weight: 900;
    }

    p {
      color: #b8b8b8;
      font-size: 16px;
      line-height: 1.7;
      margin-bottom: 28px;
      font-weight: 600;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      background: #fff;
      color: #000;
      padding: 15px 24px;
      border-radius: 16px;
      font-weight: 900;
      transition: .25s;
      box-shadow: 0 18px 45px rgba(255, 255, 255, .08);
    }

    .btn:hover {
      transform: translateY(-3px);
      background: #e7e7e7;
    }

    .footer {
      margin-top: 24px;
      color: #666;
      font-size: 13px;
      font-weight: 700;
    }

    @media (max-width: 480px) {
      .box {
        padding: 34px 22px;
        border-radius: 24px;
      }

      .btn {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <main class="box">
    <div class="icon">🐈‍⬛</div>

    <h1>Base APIs</h1>

    <p>
      Uma base feita para iniciantes que querem aprender, editar e criar seu próprio
      site de APIs com uma estrutura simples, limpa e fácil de entender.
    </p>

    <a href="/docs" class="btn">Entrar no painel →</a>

    <div class="footer">
      By Dylan Modz
    </div>
  </main>
</body>
</html>
